
name: Update competitive programming ratings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch ratings
        run: python scripts/update_ratings.py

      - name: Commit snapshot
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "Ratings JSON is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json
          git commit -m "chore: update competitive programming ratings"
          git push
